name: Docs

# The Astro + Starlight site in docs/: the guide pages and the catalogue that `scope-profiler site`
# writes from catalogue.yaml. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel, and the live site is checked.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.5.2
    with:
      notebooks: false
      # fetch the profiling files, then write the catalogue pages and chart data
      pre-build: bash scripts/fetch_data.sh && uv run scope-profiler site catalogue.yaml -o docs
      smoke-paths: |
        guide/use-this-template/index.html
        catalogue/index.html
        catalogue/index.json
        catalogue/solvers/poisson-strong/index.html
        catalogue/solvers/poisson-strong/np1/index.html
        catalogue/solvers/poisson-strong/np4/index.html
        catalogue/solvers/poisson-strong/02-speedup.0.plot.json
        catalogue/solvers/poisson-nightly/index.html
        catalogue/solvers/poisson-nightly/compare/index.html
        catalogue/solvers/poisson-hybrid/index.html
        catalogue/solvers/vlasov-cpu-gpu/index.html
        catalogue/solvers/vlasov-cpu-gpu/cpu-node/index.html
        catalogue/solvers/vlasov-cpu-gpu/cpu-node/files/cpu-node.yml
        catalogue/fields/turbulence/baseline/index.html
