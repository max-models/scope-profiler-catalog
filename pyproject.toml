# Not a package: this repository is a template for profiling catalogue websites. The file exists
# because the shared docs workflow installs the project with uv before it builds the site, and
# to say which Python packages that needs.

[project]
name = "scope-profiler-catalog"
version = "0.1.0"
description = "Template for profiling catalogue websites built with scope-profiler and Astro."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
dependencies = [  ]
optional-dependencies.dev = [
  "pre-commit",
  "ruff",
  "scope-profiler-catalog[docs]",
]
optional-dependencies.docs = [
  "h5py",
  # the notebook tooling of the shared docs workflow installs a kernel even without notebooks
  "ipykernel",
  "numpy",
  "scope-profiler[pproc,site]",
]
urls.Source = "https://github.com/max-models/scope-profiler-catalog"

[tool.uv]
package = false

# `scope-profiler site` is not in a release yet: follow the development branch, and drop this
# table once a scope-profiler release has it (then require that version above).
[tool.uv.sources]
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }

[tool.ruff]
target-version = "py310"
line-length = 88
# pycodestyle, pyflakes, isort, pyupgrade and bugbear
lint.select = [ "B", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
